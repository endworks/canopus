name: ci

# Always-on build + lint check for every push and PR, independent of which
# services the deploy workflow decides to build.
on:
  push:
    branches:
      - main
      - "feature/**"
      # Branches an agent works on, which reach main through a merge as often
      # as through a pull request and were getting no check either way.
      - "claude/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
      - run: pnpm lint
      # Every workspace's tests. They existed before this line did and nobody
      # ran them, which is how two suites came to be scaffold left over from
      # `nest new` — calling a method its controller does not have — without
      # anything going red.
      - run: pnpm turbo test
