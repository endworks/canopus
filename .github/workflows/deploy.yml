name: deploy

on:
  push:
    branches:
      - main
      - "feature/**"
    tags: ["v*.*.*"]
  pull_request:
    branches:
      - main
  # Manual redeploy, for when the images are already built but the deploy step
  # failed (a bad secret reference, an unreachable host).
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to deploy: "all" or a comma-separated subset'
        required: false
        default: all
        type: string

# A second push to the same ref supersedes the first. Without this the older
# run keeps going and can finish its deploy *after* the newer one, putting the
# previous commit back on the server — and until then both are building,
# pushing and restarting every container.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Rotates the weather client key, which is derived from the WeatherKit
  # private key rather than stored — bump this, redeploy, ship the clients.
  # `pnpm --filter @canopus/weather client-key` prints the current one.
  WEATHER_CLIENT_KEY_VERSION: "1"

jobs:
  # Work out which deployable services this change affects. A service is
  # affected by its own files, by the shared package it depends on, or by
  # root-level config that affects every package. A version tag releases all.
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      any: ${{ steps.set-matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect changed paths
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            common: &common
              - 'packages/nest/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'package.json'
              - 'Dockerfile'
            gateway:
              - *common
              - 'apps/gateway/**'
            zaragoza:
              - *common
              - 'apps/zaragoza/**'
            zine:
              - *common
              - 'apps/zine/**'
            weather:
              - *common
              - 'apps/weather/**'
            rae:
              - *common
              - 'apps/rae/**'
            twitter-downloader:
              - *common
              - 'apps/twitter-downloader/**'

      - name: Build deploy matrix from affected services
        id: set-matrix
        env:
          # Via env, not inline interpolation, so the input can't break the script.
          SERVICES: ${{ inputs.services }}
        run: |
          ALL='["gateway","zaragoza","zine","weather","rae","twitter-downloader"]'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "$SERVICES" ] || [ "$SERVICES" = "all" ]; then
              CHANGED="$ALL"
            else
              CHANGED=$(printf '%s' "$SERVICES" | jq -Rc '
                split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
            fi
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            CHANGED="$ALL"
          else
            CHANGED='${{ steps.filter.outputs.changes }}'
          fi
          MATRIX=$(jq -cn --argjson changed "$CHANGED" '
            {
              gateway:  {service:"gateway",  image:"canopus",          container:"canopus",          port:"3000:3000", db:false, dockerfile:"apps/gateway/Dockerfile"},
              zaragoza: {service:"zaragoza", image:"canopus-zaragoza", container:"canopus-zaragoza", port:"8877:3000", db:true, dockerfile:"Dockerfile"},
              zine:     {service:"zine",     image:"canopus-zine",     container:"canopus-zine",     port:"8878:3000", db:true, dockerfile:"Dockerfile"},
              weather:  {service:"weather",  image:"canopus-weather",  container:"canopus-weather",  port:"8880:3000", db:false, dockerfile:"Dockerfile"},
              rae:      {service:"rae",      image:"canopus-rae",      container:"canopus-rae",      port:"8879:3000", db:false, dockerfile:"Dockerfile"},
              "twitter-downloader": {service:"twitter-downloader", image:"canopus-twitter-downloader", container:"canopus-twitter-downloader", port:"8876:3000", db:false, dockerfile:"Dockerfile"}
            } as $cfg
            | {include: [ $changed[] | select($cfg[.] != null) | $cfg[.] ]}
          ')
          COUNT=$(echo "$MATRIX" | jq '.include | length')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$COUNT" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Affected services: $MATRIX"

  # Build, sign and deploy each affected service in parallel.
  deploy:
    name: deploy ${{ matrix.service }}
    needs: detect
    if: ${{ needs.detect.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.2.2"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load registry secret
        # Its only consumer is the login step below, which is skipped on pull
        # requests — so without this guard every PR made six 1Password round
        # trips for a token it then discarded.
        if: github.event_name != 'pull_request'
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GITHUB_TOKEN: op://end.works/GitHub Token/credential

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ env.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/endworks/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # One Dockerfile for every service but the gateway — see the note at
          # the top of it. The gateway keeps its own only because it is the one
          # app with a `.env` to copy, and a COPY whose glob matches nothing is
          # a build error rather than a no-op.
          build-args: |
            SERVICE=${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          # Caching is an optimization; a flaky GHA cache service (503s) must
          # not fail the build/push/deploy.
          # Written only where it can be read back. A pull request's cache is
          # visible to that PR alone, so six `mode=max` scopes from a PR return
          # nothing next run and evict main's from the repo's 10 GB by LRU.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0},ignore-error=true', matrix.service) || '' }}

      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      - name: Load deploy secrets
        if: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_type == 'tag') }}
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          HOST: op://end.works/end.works/URL
          PORT: op://end.works/end.works/port
          USERNAME: op://end.works/LoveLust Deploy/username
          KEY: op://end.works/LoveLust Deploy/private key

      - name: Load database secret
        if: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_type == 'tag') && matrix.db }}
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          MONGODB_URI: op://end.works/MongoDB ZgzPls/mongodb uri

      - name: Load twitter secret
        if: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_type == 'tag') && matrix.service == 'twitter-downloader' }}
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TWITTER_CLIENT_TOKEN: op://end.works/Twitter/credential

      - name: Load themoviedb secret
        if: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_type == 'tag') && matrix.service == 'zine' }}
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          THE_MOVIE_DB_API_KEY: op://end.works/The Movie DB API Key/credential
          # The same Google Cloud key Arcturus uses for YouTube. Optional: with
          # it, `updateAll` places the venues that have no coordinates on a map
          # once each; without it that pass is skipped and billboards serve as
          # they always did.
          GOOGLE_MAPS_API_KEY: op://end.works/Polaris Config/google

      - name: Load anthropic secret
        if: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_type == 'tag') && matrix.service == 'zaragoza' }}
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # The key Arcturus already uses. Optional: with it, each service
          # alert's article is read for when the alteration ends and which
          # stops it affects; without it the alerts are stored exactly as the
          # operator lists them.
          ANTHROPIC_API_KEY: op://end.works/Polaris Config/anthropic

      - name: Load weatherkit secrets
        if: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_type == 'tag') && matrix.service == 'weather' }}
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          WEATHERKIT_TEAM_ID: op://end.works/Apple WeatherKit/team id
          WEATHERKIT_SERVICE_ID: op://end.works/Apple WeatherKit/service id
          WEATHERKIT_KEY_ID: op://end.works/Apple WeatherKit/key id
          # Stored base64-encoded: a .p8 is a PEM block, and its newlines do
          # not survive the trip through this environment, the SSH hop and
          # `docker run -e` intact.
          WEATHERKIT_PRIVATE_KEY: op://end.works/Apple WeatherKit/private key

      - name: Compute image ref and container name
        if: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_type == 'tag') }}
        run: |
          # main -> :latest; tag vX.Y.Z -> :X.Y.Z (matches the metadata {{version}} tag).
          # Either way deploy to the normal container so we never collide on the host port.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG=latest
          fi
          echo "IMAGE=${{ env.REGISTRY }}/endworks/${{ matrix.image }}:$TAG" >> "$GITHUB_ENV"
          echo "CONTAINER=${{ matrix.container }}" >> "$GITHUB_ENV"

      - name: Deploy image to server
        if: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_type == 'tag') }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.HOST }}
          port: ${{ env.PORT }}
          username: ${{ env.USERNAME }}
          key: ${{ env.KEY }}
          envs: IMAGE,CONTAINER,MONGODB_URI,TWITTER_CLIENT_TOKEN,THE_MOVIE_DB_API_KEY,GOOGLE_MAPS_API_KEY,ANTHROPIC_API_KEY,WEATHERKIT_TEAM_ID,WEATHERKIT_SERVICE_ID,WEATHERKIT_KEY_ID,WEATHERKIT_PRIVATE_KEY,WEATHER_CLIENT_KEY_VERSION
          script: |
            docker pull "$IMAGE"
            # -t 1, because nothing here installs a SIGTERM handler: no app
            # calls enableShutdownHooks, so the default 10s grace is ten
            # seconds of the public API being down waiting for a signal that
            # will be ignored and followed by SIGKILL regardless.
            docker stop -t 1 "$CONTAINER" 2>/dev/null || true
            docker rm "$CONTAINER" 2>/dev/null || true
            if [ "$CONTAINER" = "canopus-zine" ]; then
              docker run --network canopus -p ${{ matrix.port }}/tcp -e MONGODB_URI="$MONGODB_URI" -e THE_MOVIE_DB_API_KEY="$THE_MOVIE_DB_API_KEY" -e GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY" -d --restart unless-stopped --name "$CONTAINER" "$IMAGE"
            elif [ "$CONTAINER" = "canopus-zaragoza" ]; then
              docker run --network canopus -p ${{ matrix.port }}/tcp -e MONGODB_URI="$MONGODB_URI" -e ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" -d --restart unless-stopped --name "$CONTAINER" "$IMAGE"
            elif [ "$CONTAINER" = "canopus-weather" ]; then
              docker run --network canopus -p ${{ matrix.port }}/tcp -e WEATHERKIT_TEAM_ID="$WEATHERKIT_TEAM_ID" -e WEATHERKIT_SERVICE_ID="$WEATHERKIT_SERVICE_ID" -e WEATHERKIT_KEY_ID="$WEATHERKIT_KEY_ID" -e WEATHERKIT_PRIVATE_KEY="$WEATHERKIT_PRIVATE_KEY" -e WEATHER_CLIENT_KEY_VERSION="$WEATHER_CLIENT_KEY_VERSION" -d --restart unless-stopped --name "$CONTAINER" "$IMAGE"
            elif [ "$CONTAINER" = "canopus-twitter-downloader" ]; then
              docker run --network canopus -p ${{ matrix.port }}/tcp -e TWITTER_CLIENT_TOKEN="$TWITTER_CLIENT_TOKEN" -d --restart unless-stopped --name "$CONTAINER" "$IMAGE"
            else
              docker run --network canopus -p ${{ matrix.port }}/tcp -d --restart unless-stopped --name "$CONTAINER" "$IMAGE"
            fi
