services:
  canopus:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    image: ghcr.io/endworks/canopus
    ports:
      - 3000:3000
    networks:
      - canopus

  canopus-zaragoza:
    build:
      context: .
      dockerfile: apps/zaragoza/Dockerfile
    image: ghcr.io/endworks/canopus-zaragoza
    ports:
      - 8877:3000
    environment:
      MONGODB_URI: ${MONGODB_URI:-}
    networks:
      - canopus
    depends_on:
      - canopus

  canopus-zine:
    build:
      context: .
      dockerfile: apps/zine/Dockerfile
    image: ghcr.io/endworks/canopus-zine
    ports:
      - 8878:3000
    environment:
      MONGODB_URI: ${MONGODB_URI:-}
      THE_MOVIE_DB_API_KEY: ${THE_MOVIE_DB_API_KEY:-}
    networks:
      - canopus
    depends_on:
      - canopus

  canopus-weather:
    build:
      context: .
      dockerfile: apps/weather/Dockerfile
    image: ghcr.io/endworks/canopus-weather
    ports:
      - 8880:3000
    environment:
      # All four or none. Absent, the service holds no credential and callers
      # bring their own WeatherKit token; set, its own app can send nothing.
      # The private key is the .p8 base64-encoded — see the README.
      WEATHERKIT_TEAM_ID: ${WEATHERKIT_TEAM_ID:-}
      WEATHERKIT_SERVICE_ID: ${WEATHERKIT_SERVICE_ID:-}
      WEATHERKIT_KEY_ID: ${WEATHERKIT_KEY_ID:-}
      WEATHERKIT_PRIVATE_KEY: ${WEATHERKIT_PRIVATE_KEY:-}
      # Who may spend that credential. Left unset, one is derived from the
      # private key above, and bumping the version rotates it. Set
      # WEATHER_CLIENT_KEYS to take that over with your own comma-separated list.
      WEATHER_CLIENT_KEY_VERSION: ${WEATHER_CLIENT_KEY_VERSION:-}
      WEATHER_CLIENT_KEYS: ${WEATHER_CLIENT_KEYS:-}
      # Where the gateway serves the marks some sources require shown. This is
      # the gateway's own public address plus /assets — it must be reachable by
      # the client drawing the credit, not by this container, so it cannot be
      # guessed from the network. Unset, those sources fall back to a name and
      # a licence link.
      WEATHER_ASSETS_URL: ${WEATHER_ASSETS_URL:-}
    networks:
      - canopus
    depends_on:
      - canopus

  canopus-rae:
    build:
      context: .
      dockerfile: apps/rae/Dockerfile
    image: ghcr.io/endworks/canopus-rae
    ports:
      - 8879:3000
    networks:
      - canopus
    depends_on:
      - canopus

  canopus-twitter-downloader:
    build:
      context: .
      dockerfile: apps/twitter-downloader/Dockerfile
    image: ghcr.io/endworks/canopus-twitter-downloader
    ports:
      - 8876:3000
    environment:
      TWITTER_CLIENT_TOKEN: ${TWITTER_CLIENT_TOKEN:-}
    networks:
      - canopus
    depends_on:
      - canopus

networks:
  canopus:
    driver: bridge
