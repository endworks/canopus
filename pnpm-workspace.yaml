packages:
  - 'apps/*'
  - 'packages/*'
# Force patched versions of vulnerable transitive deps shipped in production.
# Every one of these is a caret and not a `>=`: an open range here resolves to
# the newest version that satisfies it, which is the next major the moment one
# is published, and an override outranks what a package asked for. `js-yaml@3:
# '>=3.15.2'` handed js-yaml 5 to a reader that wanted 3.
overrides:
  multer: '^2.3.0'
  # express 5 and body-parser both allow it; they just have not asked yet.
  qs: '^6.16.0'
  # GHSA-2883-xcg3-v3hh. The 3.x line left with jest; what still asks for a
  # vulnerable js-yaml is the CLI's type checker, through cosmiconfig, and the
  # runtime image is built `--prod`, so it does not ship. swagger's js-yaml 5
  # is unaffected.
  'js-yaml@4': '^4.3.2'
allowBuilds:
  # swc ships a prebuilt native binding per platform, musl included, so
  # this resolves a download and not a compile.
  '@swc/core': true
  '@scarf/scarf': false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - ts-loader@9.6.2
