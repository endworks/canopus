packages:
  - 'apps/*'
  - 'packages/*'
# Force patched versions of vulnerable transitive deps shipped in production.
overrides:
  multer: '>=2.2.0'
  '@nestjs/swagger>js-yaml': '>=4.1.2'
  # express 5 and body-parser both allow it; they just have not asked yet.
  qs: '>=6.16.0'
allowBuilds:
  '@scarf/scarf': false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - ts-loader@9.6.2
