packages:
  - 'apps/*'
  - 'packages/*'
# Force patched versions of vulnerable transitive deps shipped in production.
overrides:
  multer: '>=2.2.0'
  '@nestjs/swagger>js-yaml': '>=4.1.2'
  # Pin the js-yaml pulled in through jest's coverage tooling to the patched
  # 3.x release (quadratic-complexity DoS in merge-key handling, <3.15.0).
  # load-nyc-config still relies on the 3.x API, so stay below 4.
  '@istanbuljs/load-nyc-config>js-yaml': '>=3.15.0 <4.0.0'
allowBuilds:
  '@scarf/scarf': false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - ts-loader@9.6.2
